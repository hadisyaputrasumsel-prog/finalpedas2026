version: '3.8'

services:
  dashboard:
    build: .
    container_name: pedas2026-dashboard
    ports:
      - "8501"
    restart: unless-stopped
    volumes:
      # Mount current dir to /app to override and pick up changes instantly
      - .:/app
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
